# This is a Databricks asset bundle definition for template_ml_dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: template_ml_dab_project
  uuid: 4b096308-dc40-455a-af9f-6470f006e22a

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6a5addb8-c11c.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-6a5addb8-c11c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/geo.mate2010@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/geo.mate2010@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: geo.mate2010@gmail.com
        level: CAN_MANAGE
