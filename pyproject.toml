[project]
name = "template_ml_dab_project"
version = "0.0.1"
authors = [{ name = "geo.mate2010@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.10.0",
    "joblib"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "template_ml_dab_project.main:main"
train = "template_ml_dab_project.ml:train_main"
predict = "template_ml_dab_project.ml:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
